name: Nasazení aiid.cz na WEDOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: ftp-deploy-aiid
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Nahrát na WEDOS přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: /www/
          # Nahrávají se jen soubory webu. Na serveru se nic jiného
          # nemaže ani nepřepisuje (.htaccess, subdom/, domains/).
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            index_ok.html
            index_pills.html
            **/.DS_Store
